[project]
name = "advisordesk-cas-parser"
version = "0.1.0"
description = "Provider-independent CAS PDF parsing service for AdvisorDesk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pdfplumber>=0.11,<1",
  "PyMuPDF>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "structlog>=24,<26",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13,<1",
  "rapidocr-onnxruntime>=1.4,<2",
]
ml = [
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=3.2,<4",
]
workers = [
  "celery>=5.4,<6",
  "redis>=5.0,<6",
]
db = [
  "psycopg[binary]>=3.12,<4",
]
monitoring = [
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.28,<2",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
inspect-pdf = "scripts.inspect_pdf:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
